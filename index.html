
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <hr>

        <h1>Student Registration</h1>

        <form id="studentForm">

            <div class="form-row">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required>
            </div>

            <div class="form-row">
                <label for="middleName">Middle Name</label>
                <input type="text" id="middleName">
            </div>

            <div class="form-row">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" required>
            </div>

            <div class="form-row">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-row">
                <label for="course">Course</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BSCS">BSCS (BACHELOR OF SCIENCE IN COMPUTER SCIENCE)</option>
                    <option value="BSIS">BSIS (BACHELOR OF INFORMATION SYSTEM)</option>
                    <option value="BSEE">BSEE (ELECTRICAL ENGINEERING)</option>
                    <option value="BS NURSING">BS NURSING</option>
                    <option value="BSIT">BSIT (BACHELOR OF INFORMATION TECHNOLOGY)</option>
                    <option value="BSCRIM">BSCRIM (BACHELOR OF SCIENCE CRIMINOLOGY)</option>
                    <option value="BSBA">BSBA (BUSINESS ADMINISTRATION)</option>
                    <option value="BSHM">BSHM (BACHELOR OF HOSPITALITY MANAGEMENT)</option>
                </select>
            </div>

            <div class="form-row">
                <label for="year">Year Level</label>
                <select id="year" required>
                    <option value="">Select Year Level</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <div class="form-row">
                <label for="section">Section</label>
                <input type="text" id="section"
                    placeholder="Example: BSIS 2-1" required>
            </div>

            <button type="submit">Add Student</button>

        </form>

        <h2>Registered Students</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr id="emptyRow">
                        <td colspan="6">No students registered yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
